# Docker Swarm stack for the TikTok-clone backend + Postgres + MinIO.
#
# Build & smoke-test locally on a single-node swarm:
#   docker swarm init                       # once
#   docker build -t tiktok-backend:latest .
#   docker stack deploy -c docker-stack.yml tiktok
#   docker service ls
#
# For a multi-node swarm (or CapRover's built-in registry) push the image and
# set `image:` to the registry path. On CapRover you typically deploy the app
# via captain-definition and run Postgres + MinIO as separate one-click apps
# instead of this stack — see readme.md.
version: '3.8'

services:
  backend:
    image: ${BACKEND_IMAGE:-tiktok-backend:latest}
    depends_on:
      - postgres
      - minio
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tiktok
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
      # Backend reaches MinIO over the overlay network; clients need a public URL.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: uploads
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/uploads}
    ports:
      - '4000:4000'
    networks:
      - tiktok
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tiktok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tiktok
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - tiktok
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/uploads;
      mc anonymous set download local/uploads;
      echo 'bucket uploads ready';
      "
    networks:
      - tiktok
    deploy:
      replicas: 1
      restart_policy:
        condition: none

networks:
  tiktok:
    driver: overlay

volumes:
  postgres_data:
  minio_data:
